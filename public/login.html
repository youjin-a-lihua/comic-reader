<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>登录 — 漫画阅读器</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* 与主界面 (fnos-theme.css) 同一套设计语言：环境光渐变背景 + 玻璃态卡片 + 统一强调色 */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      --spring: cubic-bezier(0.32, 0.72, 0, 1);
      --glass-panel: rgba(20, 20, 22, 0.75);
      --line: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.6);
      --accent: #0A84FF;
      --danger: #ff453a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--font); color: var(--text-main);
      background: radial-gradient(125% 125% at 50% 0%, #16161f 0%, #0b0b11 45%, #050507 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }

    /* 环境光斑（与主界面 ambient-bg 一致的观感） */
    .bg-glow { position: fixed; border-radius: 50%; filter: blur(110px); pointer-events: none; z-index: 0; }
    .bg-glow-1 { width: 460px; height: 460px; top: -170px; left: -130px; background: rgba(10, 132, 255, 0.20); }
    .bg-glow-2 { width: 400px; height: 400px; bottom: -150px; right: -110px; background: rgba(94, 92, 230, 0.16); }

    .login-wrapper { position: relative; z-index: 1; width: 100%; max-width: 380px; }

    .login-card {
      background: var(--glass-panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 34px 26px 26px;
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      animation: rise 0.5s var(--spring) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }

    .login-logo { text-align: center; margin-bottom: 20px; }
    .login-logo .icon { width: 52px; height: 52px; margin-bottom: 12px; }
    .login-logo h1 { font-size: 21px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.3px; }
    .login-logo .sub { font-size: 12.5px; color: var(--text-sub); margin: 0; }

    .oneclick-badge {
      text-align: center; font-size: 11.5px; color: var(--text-sub);
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
      border-radius: 999px; padding: 7px 0; margin: 0 0 18px;
    }

    .input-group { margin-bottom: 12px; }
    .input-group input {
      width: 100%; height: 46px; padding: 0 14px; font-size: 15px; font-family: var(--font);
      color: var(--text-main); background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line); border-radius: 13px; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-group input::placeholder { color: rgba(255, 255, 255, 0.32); }
    .input-group input:focus { border-color: rgba(10, 132, 255, 0.6); background: rgba(10, 132, 255, 0.07); }

    .remember-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); margin: 4px 0 20px; cursor: pointer; }
    .remember-row input { accent-color: var(--accent); width: 16px; height: 16px; }

    .btn-login {
      position: relative; width: 100%; height: 48px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: 15.5px; font-weight: 600; font-family: var(--font);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s var(--spring), opacity 0.2s;
      box-shadow: 0 10px 26px rgba(10, 132, 255, 0.30);
    }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: default; }
    .btn-login .spinner {
      display: none; width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { opacity: 0; max-height: 0; overflow: hidden; transition: opacity 0.25s var(--spring), max-height 0.25s var(--spring); }
    .error-msg.show { opacity: 1; max-height: 80px; margin-top: 14px; }
    .error-msg span {
      display: block; font-size: 12.5px; color: var(--danger);
      background: rgba(255, 69, 58, 0.1); border: 1px solid rgba(255, 69, 58, 0.25);
      border-radius: 10px; padding: 9px 12px; text-align: center;
    }

    .login-footer { text-align: center; font-size: 11.5px; color: rgba(255, 255, 255, 0.28); margin-top: 18px; }

    @media (max-width: 380px) { .login-card { padding: 26px 18px 20px; border-radius: 20px; } }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card" id="loginCard">

      <div class="login-logo">
        <svg class="icon" viewBox="0 0 64 64" fill="none">
          <rect x="12" y="10" width="26" height="44" rx="3" stroke="url(#g)" stroke-width="2.5"/>
          <rect x="25" y="10" width="26" height="44" rx="3" stroke="url(#g)" stroke-width="1.8"/>
          <path d="M38 14v36" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <defs><linearGradient id="g" x1="12" y1="10" x2="51" y2="54"><stop stop-color="#0A84FF"/><stop offset="1" stop-color="#5AC8FA"/></linearGradient></defs>
        </svg>
        <h1>漫画阅读器</h1>
        <p class="sub">使用飞牛 NAS 账号一键登录</p>
      </div>

      <!-- 一键登录提示 -->
      <div class="oneclick-badge">🔑 NAS 账号登录</div>

      <!-- 表单 -->
      <div class="input-group"><input type="text" id="username" placeholder="NAS 用户名" autocomplete="username" autofocus></div>
      <div class="input-group"><input type="password" id="password" placeholder="NAS 密码" autocomplete="current-password"></div>

      <label class="remember-row"><input type="checkbox" id="remember" checked><span>记住登录</span></label>

      <button class="btn-login" id="btnLogin" onclick="doLogin()">
        <span class="btn-text">一键登录</span>
        <div class="spinner"></div>
      </button>

      <div class="error-msg" id="errorMsg"><span id="errorText"></span></div>

    </div>
    <div class="login-footer">漫画阅读器 · 飞牛 fnOS</div>
  </div>

  <script>
    const API = window.location.origin;

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
    }
    function hideError() { document.getElementById('errorMsg').classList.remove('show'); }

    function setLoading(v) {
      var b = document.getElementById('btnLogin');
      if (v) { b.classList.add('loading'); b.disabled = true; }
      else { b.classList.remove('loading'); b.disabled = false; }
    }

    async function doLogin() {
      hideError();
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      var remember = document.getElementById('remember').checked;

      if (!u || !p) { showError('请输入 NAS 用户名和密码'); return; }

      setLoading(true);
      try {
        var res = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        var data = await res.json();
        if (!res.ok) { showError(data.error || '登录失败'); setLoading(false); return; }

        localStorage.setItem('fn_comic_token', data.token);
        localStorage.setItem('fn_comic_user', JSON.stringify(data.user));
        if (remember) {
          localStorage.setItem('fn_comic_remembered_user', u);
        } else {
          localStorage.removeItem('fn_comic_remembered_user');
        }

        window.location.href = API + '/app';
      } catch (e) {
        showError('无法连接服务器');
        setLoading(false);
      }
    }

    document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

    // 自动填充上次记住的用户名
    var saved = localStorage.getItem('fn_comic_remembered_user');
    if (saved) { document.getElementById('username').value = saved; document.getElementById('password').focus(); }

    // 已登录直接跳转
    if (localStorage.getItem('fn_comic_token')) { window.location.href = API + '/app'; }

    // 同步主题
    var savedTheme = localStorage.getItem('fn_comic_theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
