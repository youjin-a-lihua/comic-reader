<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>漫画阅读器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      --accent: #5e5ce6;
      --accent-hover: #6e6cf0;
      --accent-glow: rgba(94, 92, 230, 0.25);
    }

    body {
      font-family: var(--font);
      background: #0a0a0f;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }

    .bg-glow {
      position: fixed; border-radius: 50%; filter: blur(120px);
      opacity: 0.12; pointer-events: none; z-index: 0;
    }
    .bg-glow-1 { width: 600px; height: 600px; background: radial-gradient(circle, var(--accent), transparent); top: -200px; left: -100px; }
    .bg-glow-2 { width: 400px; height: 400px; background: radial-gradient(circle, #bf5af2, transparent); bottom: -150px; right: -100px; }

    .login-wrapper {
      position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 24px;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .login-card {
      background: rgba(22, 22, 30, 0.85);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 48px 40px 40px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 24px 64px rgba(0,0,0,0.4);
    }

    .login-logo {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 36px;
    }
    .login-logo .icon { width: 64px; height: 64px; margin-bottom: 20px; }
    .login-logo h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; }
    .login-logo .sub { font-size: 13px; color: #86868b; margin-top: 6px; }

    .input-group {
      margin-bottom: 16px;
    }
    .input-group input {
      width: 100%; height: 50px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px; color: #f5f5f7; font-family: var(--font);
      outline: none; transition: all 0.2s;
    }
    .input-group input::placeholder { color: #636368; font-size: 14px; }
    .input-group input:focus {
      border-color: rgba(94,92,230,0.5);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(255,255,255,0.08);
    }

    .remember-row {
      display: flex; align-items: center; gap: 8px; margin: 8px 0 24px;
      font-size: 13px; color: #86868b; cursor: pointer;
    }
    .remember-row input[type=checkbox] { accent-color: var(--accent); transform: scale(1.1); }

    .btn-login {
      width: 100%; height: 50px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #5e5ce6, #7b5ce6);
      color: #fff; font-size: 16px; font-weight: 600;
      font-family: var(--font); cursor: pointer;
      letter-spacing: 0.5px; transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #6e6cf0, #8b6cf0);
      box-shadow: 0 4px 20px var(--accent-glow);
      transform: translateY(-1px);
    }
    .btn-login:active { transform: translateY(0); box-shadow: none; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-login.loading .btn-text { visibility: hidden; }
    .btn-login .spinner {
      display: none;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.6s linear infinite;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    .error-msg {
      display: none; align-items: center; gap: 6px;
      font-size: 12px; color: #ff453a; margin-top: 12px; justify-content: center;
    }
    .error-msg.show { display: flex; }

    .login-footer {
      text-align: center; margin-top: 20px;
      font-size: 11px; color: #636368; opacity: 0.7;
    }

    .oneclick-badge {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 20px; padding: 10px 16px;
      background: rgba(94,92,230,0.08); border-radius: 10px;
      font-size: 13px; color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card" id="loginCard">

      <div class="login-logo">
        <svg class="icon" viewBox="0 0 64 64" fill="none">
          <rect x="12" y="10" width="26" height="44" rx="3" stroke="url(#g)" stroke-width="2.5"/>
          <rect x="25" y="10" width="26" height="44" rx="3" stroke="url(#g)" stroke-width="1.8"/>
          <path d="M38 14v36" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <defs><linearGradient id="g" x1="12" y1="10" x2="51" y2="54"><stop stop-color="#5e5ce6"/><stop offset="1" stop-color="#bf5af2"/></linearGradient></defs>
        </svg>
        <h1>漫画阅读器</h1>
        <p class="sub">使用飞牛 NAS 账号一键登录</p>
      </div>

      <!-- 一键登录提示 -->
      <div class="oneclick-badge">🔑 NAS 账号登录</div>

      <!-- 表单 -->
      <div class="input-group"><input type="text" id="username" placeholder="NAS 用户名" autocomplete="username" autofocus></div>
      <div class="input-group"><input type="password" id="password" placeholder="NAS 密码" autocomplete="current-password"></div>

      <label class="remember-row"><input type="checkbox" id="remember" checked><span>记住登录</span></label>

      <button class="btn-login" id="btnLogin" onclick="doLogin()">
        <span class="btn-text">一键登录</span>
        <div class="spinner"></div>
      </button>

      <div class="error-msg" id="errorMsg"><span id="errorText"></span></div>

    </div>
    <div class="login-footer">漫画阅读器 v1.0 · 飞牛 fnOS</div>
  </div>

  <script>
    const API = window.location.origin;

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
    }
    function hideError() { document.getElementById('errorMsg').classList.remove('show'); }

    function setLoading(v) {
      var b = document.getElementById('btnLogin');
      if (v) { b.classList.add('loading'); b.disabled = true; }
      else { b.classList.remove('loading'); b.disabled = false; }
    }

    async function doLogin() {
      hideError();
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      var remember = document.getElementById('remember').checked;

      if (!u || !p) { showError('请输入 NAS 用户名和密码'); return; }

      setLoading(true);
      try {
        var res = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        var data = await res.json();
        if (!res.ok) { showError(data.error || '登录失败'); setLoading(false); return; }

        localStorage.setItem('fn_comic_token', data.token);
        localStorage.setItem('fn_comic_user', JSON.stringify(data.user));
        if (remember) {
          localStorage.setItem('fn_comic_remembered_user', u);
        } else {
          localStorage.removeItem('fn_comic_remembered_user');
        }

        window.location.href = API + '/app';
      } catch (e) {
        showError('无法连接服务器');
        setLoading(false);
      }
    }

    document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

    // 自动填充上次记住的用户名
    var saved = localStorage.getItem('fn_comic_remembered_user');
    if (saved) { document.getElementById('username').value = saved; document.getElementById('password').focus(); }

    // 已登录直接跳转
    if (localStorage.getItem('fn_comic_token')) { window.location.href = API + '/app'; }

    // 同步主题
    var savedTheme = localStorage.getItem('fn_comic_theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
